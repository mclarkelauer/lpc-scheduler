name: Refresh schedule snapshot

on:
  schedule:
    # Every 15 minutes. The first job step disables this workflow after Oct 8 (UTC),
    # once the conference is over. The footer text in rebuild.py mentions this
    # schedule; keep the two in step.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rewrite the snapshot even if the schedule has not changed
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets the workflow disable itself after the conference

concurrency:
  group: refresh-snapshot

defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stop polling once the conference is over
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261008 ]; then
            gh workflow disable refresh.yml --repo "$GITHUB_REPOSITORY" \
              && echo "The conference is over: scheduled refresh disabled." \
              || echo "Could not disable the workflow; disable it in the Actions tab."
          fi

      - uses: actions/checkout@v7

      - name: Rebuild from lpc.events
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python3 rebuild.py "${args[@]}" | tee "$RUNNER_TEMP/report.txt"

      - name: Commit and push if the snapshot changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Snapshot unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The commit body lists what changed in the schedule.
          git commit -q -m "Refresh schedule snapshot" \
            -m "$(grep -v -e '^Fetching ' -e '^Wrote ' "$RUNNER_TEMP/report.txt")" -- index.html
          git push
